<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf7" />
    <meta name="description" content="ME2LON — Formal verification for software. Mathematical reasoning for software you can trust." />
    <meta property="og:title" content="ME2LON — Software. With proof." />
    <meta property="og:description" content="Formal verification for software. Mathematical reasoning for software you can trust." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://me2lon.com/" />
    <meta property="og:image" content="https://me2lon.com/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://me2lon.com/" />
    <link rel="icon" type="image/png" href="logo.png" />
    <style>
:root {
  color-scheme: light;
  --paper: #fafaf7;
  --ink: #30362c;
  --muted: #777b70;
  --melon: #ddd273;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 7px; }
::selection { background: var(--melon); color: var(--ink); }
.page { max-width: 1440px; min-height: 100svh; padding: 0 6.25%; margin: 0 auto; display: flex; flex-direction: column; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 37px 0; }
.wordmark { font-size: 25px; font-weight: 700; letter-spacing: -1.3px; }
.wordmark > span:first-child { font-weight: 400; }
.brand-dot { color: #a79b38; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.hero { display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: 6%; padding: 73px 0 87px; }
.eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 28px; font-size: 10px; font-weight: 500; letter-spacing: 1.8px; line-height: 1.6; }
.small-line { display: inline-block; width: 23px; height: 2px; background: #b5aa53; flex-shrink: 0; }
h1 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(64px, 6.75vw, 96px); font-weight: 400; letter-spacing: -5px; line-height: 1.04; }
.proof { position: relative; display: inline-block; font-style: italic; }
.proof svg { position: absolute; left: 0; bottom: -9px; width: 100%; height: 15px; overflow: visible; }
.proof path { stroke: var(--melon); stroke-width: 7; stroke-linecap: round; fill: none; }
.description { font-size: 16px; line-height: 1.85; color: #6a7063; margin: 31px 0 27px; }
.contact-link { display: inline-flex; align-items: center; justify-content: space-between; gap: 46px; min-height: 45px; padding: 0 0 8px; border-bottom: 1px solid #adb39f; font-size: 14px; font-weight: 500; }
.contact-link span { font-size: 22px; transition: transform 160ms ease; }
.contact-link:hover { border-color: #817729; }
.contact-link:hover span { transform: translate(3px, -3px); }
.illustration { margin: 13px 0 0; justify-self: center; width: min(100%, 470px); }
.logo-frame { position: relative; padding: 14px; overflow: hidden; }
.logo-frame img { display: block; width: 130%; height: auto; margin-inline: -15%; mix-blend-mode: multiply; }
.figure-corner { position: absolute; width: 16px; height: 16px; border-color: #d7dbcd; border-style: solid; }
.top-left { left: 0; top: 0; border-width: 1px 0 0 1px; }
.bottom-right { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
figcaption { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 25px; color: var(--muted); font-size: 11px; letter-spacing: .2px; }
figcaption > span { font-family: Georgia, serif; font-size: 19px; color: #9a9257; }
.footer { padding: 29px 0; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.5; }
.skip-link { position: fixed; top: -100px; left: 20px; z-index: 5; background: var(--paper); padding: 15px; }
.skip-link:focus { top: 15px; }

@media (min-width: 1440px) {
  .page { padding: 0 90px; }
}

@media (max-width: 850px) {
  .page { padding: 0 6%; }
  .hero { gap: 3%; padding: 70px 0; }
  h1 { font-size: 70px; letter-spacing: -3.8px; }
  .eyebrow { font-size: 9px; letter-spacing: 1.1px; gap: 8px; }
  .description { font-size: 14px; }
  .desktop-break { display: none; }
  .illustration { width: min(100%, 350px); }
}

@media (max-width: 600px) {
  .page { padding: 0 7%; }
  .header { padding: 26px 0; }
  .wordmark { font-size: 23px; }
  .hero { grid-template-columns: 1fr; padding: 53px 0 42px; gap: 43px; }
  .eyebrow { margin-bottom: 24px; font-size: 8px; letter-spacing: 1.3px; }
  h1 { font-size: clamp(62px, 15vw, 85px); letter-spacing: -3px; }
  .description { font-size: 15px; max-width: 340px; margin-top: 28px; }
  .contact-link { font-size: 13px; gap: 45px; }
  .illustration { width: min(100%, 290px); margin: 0; }
  figcaption { margin-top: 16px; font-size: 10px; }
  .footer { font-size: 10px; padding: 24px 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
    </style>
    <title>ME2LON — Software. With proof.</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="header">
        <a class="wordmark" href="#" aria-label="ME2LON home">ME<span>2</span>LON<span class="brand-dot" aria-hidden="true">.</span></a>
      </header>

      <main id="main">
        <section class="hero" aria-labelledby="headline">
          <div class="intro">
            <p class="eyebrow"><span class="small-line" aria-hidden="true"></span> FORMAL VERIFICATION FOR AI GENERATED CODE</p>
            <h1 id="headline">Software.<br />With <span class="proof">proof<svg viewBox="0 0 260 17" preserveAspectRatio="none" aria-hidden="true"><path d="M4 12 Q120 1 254 8" /></svg></span>.</h1>
            <p class="description">We help teams prove that their AI-generated code<br class="desktop-break" /> satisfies specific requirements.</p>
            <a class="contact-link" href="https://x.com/ME2LONtech">Message us on X <span aria-hidden="true">↗</span></a>
          </div>

          <figure class="illustration">
            <div class="logo-frame">
              <span class="figure-corner top-left" aria-hidden="true"></span>
              <span class="figure-corner bottom-right" aria-hidden="true"></span>
              <img src="logo.png" width="1121" height="944" alt="ME2LON logo: a melon half joined to a mathematical sphere, with phi and gamma notation." fetchpriority="high" />
            </div>
            <figcaption><span aria-hidden="true">φ</span> A little curiosity. A lot of rigor.</figcaption>
          </figure>
        </section>

      </main>

      <footer class="footer">
        <span>© <span id="year">2026</span> ME2LON</span>
      </footer>
    </div>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
